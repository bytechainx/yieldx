[package]
name = "yieldx"
version = "0.1.1"
edition = "2021"
rust-version = "1.71"
description = "收益率曲线 kernel 的 L0 值对象与批校验：期限 / 曲线种类 / 惯例 / 曲线点身份 / 官方与派生二分 / 批内身份唯一"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bytechainx/yieldx"
homepage = "https://github.com/bytechainx/yieldx"
documentation = "https://github.com/bytechainx/yieldx#readme"
readme = "README.md"
keywords = ["yield-curve", "kernel", "finance", "interest-rate", "valuation"]
categories = ["finance", "data-structures"]
include = [
    "src/**/*",
    "tests/**/*",
    "benches/**/*",
    "examples/**/*",
    "docs/**/*",
    "README.md",
    "CHANGELOG.md",
    "CONTEXT.md",
    "CONTRIBUTING.md",
    "LICENSE-*",
    "Cargo.toml",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]

[[bench]]
name = "hot_path"
harness = false

[lints.rust]
private_interfaces = "deny"
private_bounds = "deny"
unused_must_use = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
